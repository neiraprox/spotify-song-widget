<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song Widget V2</title>
<style>
:root{--accent:#1ed760;--rgb:30,215,96;--text:#fff;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
.back{position:fixed;inset:-50px;z-index:-2;background:center/cover no-repeat;filter:blur(55px) saturate(1.4);transform:scale(1.15);opacity:.55}.back:after{content:"";position:absolute;inset:0;background:linear-gradient(#0002,#000b)}
.ambient{position:fixed;inset:-20%;z-index:-1;pointer-events:none;overflow:hidden;mix-blend-mode:screen;opacity:.72}
.light{position:absolute;width:45vw;height:45vw;min-width:280px;min-height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--rgb),.55) 0%,rgba(var(--rgb),.22) 28%,transparent 68%);
  filter:blur(35px);transform:translate3d(0,0,0);transition:background 1.1s ease,filter 1.1s ease;
  animation:floatLight 13s ease-in-out infinite alternate}
.light1{left:-8%;top:0}.light2{right:-12%;top:8%;animation-delay:-4s;animation-duration:16s}
.light3{left:12%;bottom:-18%;animation-delay:-7s;animation-duration:19s}
.light4{right:8%;bottom:-25%;animation-delay:-2s;animation-duration:15s}
@keyframes floatLight{0%{transform:translate3d(-4%,3%,0) scale(.92)}
50%{transform:translate3d(5%,-5%,0) scale(1.08)}
100%{transform:translate3d(-2%,6%,0) scale(1)}}
@media(prefers-reduced-motion:reduce){.light{animation:none}.light{transition:none}}
.app{min-height:100vh;padding:22px;display:grid;place-items:center}.grid{width:min(1150px,100%);display:grid;grid-template-columns:minmax(300px,550px) 1fr;gap:34px;align-items:center}
.brand{font-weight:800;margin-bottom:16px;display:flex;gap:9px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgb(var(--rgb)/.7)}
.coverbox{aspect-ratio:1;border-radius:25px;overflow:hidden;position:relative;background:#151515;box-shadow:0 30px 80px #0009;cursor:zoom-in}.cover{width:100%;height:100%;object-fit:cover;display:block}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:80px}.hint{position:absolute;right:14px;bottom:14px;background:#0008;padding:8px 11px;border-radius:99px;font-size:12px}
.status{font-size:13px;color:var(--muted);margin-bottom:12px}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;margin-right:7px}.status.live i{background:var(--accent);box-shadow:0 0 12px rgb(var(--rgb)/.8)}
h1{font-size:clamp(32px,5vw,58px);line-height:.98;margin:0;letter-spacing:-2px}.artist{font-size:24px;font-weight:650;margin:14px 0 4px}.album{margin:0;color:var(--muted)}
.progress{margin-top:26px}.bar{height:5px;background:#fff2;border-radius:99px;cursor:pointer}.fill{height:100%;width:0;background:var(--accent);border-radius:99px}.times{display:flex;justify-content:space-between;color:#888;font-size:11px;margin-top:7px}
.controls{display:flex;gap:15px;align-items:center;margin-top:18px}.btn{border:0;width:50px;height:50px;border-radius:50%;background:#fff1;color:#fff;display:grid;place-items:center;cursor:pointer}.btn:hover{background:#fff2}.btn.main{width:66px;height:66px;background:#fff;color:#000}.btn svg{width:23px;height:23px;fill:currentColor}
.connect{margin-top:20px;border:0;border-radius:99px;padding:13px 19px;background:var(--accent);color:#000;font-weight:800;cursor:pointer}
.panel{height:min(70vh,620px);border:1px solid #fff2;border-radius:25px;background:#0005;backdrop-filter:blur(22px);overflow:hidden;display:flex;flex-direction:column}.head{padding:19px 21px;border-bottom:1px solid #fff1;display:flex;justify-content:space-between}.head h2{margin:0;font-size:18px}.source{font-size:11px;color:#777}.lyrics{overflow:auto;padding:25px 21px;scroll-behavior:smooth}.line{margin:0 0 18px;color:#777;font-size:clamp(17px,2.2vw,23px);line-height:1.35;font-weight:650;transition:.35s}.line.active{color:#fff;transform:scale(1.035);text-shadow:0 0 25px rgb(var(--rgb)/.3)}.empty{color:#777;line-height:1.5}
.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:#000c;backdrop-filter:blur(20px);padding:20px}.modal.open{display:grid}.modal img{max-width:94vw;max-height:88vh;border-radius:18px;touch-action:pinch-zoom}.close{position:fixed;top:18px;right:18px;border:0;border-radius:50%;width:44px;height:44px;background:#fff2;color:#fff;font-size:25px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.coverbox{width:min(84vw,520px);margin:auto}.panel{height:55vh}}
</style>
</head>
<body>
<div class="back" id="back"></div>
<div class="ambient" aria-hidden="true">
  <div class="light light1" id="light1"></div>
  <div class="light light2" id="light2"></div>
  <div class="light light3" id="light3"></div>
  <div class="light light4" id="light4"></div>
</div>
<main class="app"><div class="grid">
<section>
<div class="brand"><span class="dot"></span>Song Widget V2</div>
<div class="coverbox" id="coverbox">
<img id="cover" class="cover" alt="Portada" style="display:none">
<div id="placeholder" class="placeholder">♪</div><div class="hint">Tocar para ampliar</div>
</div>
</section>
<section>
<div class="status" id="status"><i></i>Desconectado de Spotify</div>
<h1 id="title">Conecta Spotify</h1><p class="artist" id="artist">Tu canción aparecerá aquí</p><p class="album" id="album">Portada, colores y letras automáticas</p>
<div class="progress"><div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
<div class="controls">
<button class="btn" id="prev" aria-label="Anterior"></button><button class="btn main" id="play" aria-label="Play"></button><button class="btn" id="next" aria-label="Siguiente"></button>
</div>
<button class="connect" id="connect">Conectar con Spotify</button>
<div class="panel" style="margin-top:24px"><div class="head"><h2>Letra</h2><span class="source">LRCLIB</span></div><div class="lyrics" id="lyrics"><p class="empty">Conecta Spotify para cargar la canción y sus letras.</p></div></div>
</section>
</div></main>
<div class="modal" id="modal"><button class="close" id="close">×</button><img id="modalImg" alt="Portada ampliada"></div>
<script>
const CLIENT_ID="7cd5bc8f5dc048a388537fb6d19a74b9";
const REDIRECT_URI="https://neiraprox.github.io/spotify-song-widget/";
const SCOPES=["user-read-currently-playing","user-read-playback-state","user-modify-playback-state"];
const API="https://api.spotify.com/v1";
let token=localStorage.getItem("spotify_access_token"),expires=+localStorage.getItem("spotify_expires_at")||0,currentId=null,lyrics=[],position=0,duration=0,poll;
const $=x=>document.getElementById(x);
const icons={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>',prev:'<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 9-7v14z"/></svg>',next:'<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/></svg>'};
$("play").innerHTML=icons.play;$("prev").innerHTML=icons.prev;$("next").innerHTML=icons.next;
function time(ms){let s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function status(t,live=false){$("status").className="status"+(live?" live":"");$("status").innerHTML="<i></i>"+t}
function setPlay(x){$("play").innerHTML=x?icons.pause:icons.play}
function rgb(hex){let m=hex.replace("#","").match(/../g);return m?m.map(x=>parseInt(x,16)).join(","): "30,215,96"}
function applyPalette(colors){
  if(!colors.length) return;
  const primary = colors[0];
  document.documentElement.style.setProperty("--accent", primary);
  document.documentElement.style.setProperty("--rgb", rgb(primary));

  const ids=["light1","light2","light3","light4"];
  ids.forEach((id,i)=>{
    const el=$(id);
    const c=colors[i%colors.length];
    el.style.background=`radial-gradient(circle,${c}99 0%,${c}3b 27%,transparent 68%)`;
  });
}

function theme(img){
  try{
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    const size=32;
    canvas.width=canvas.height=size;
    ctx.drawImage(img,0,0,size,size);
    const data=ctx.getImageData(0,0,size,size).data;

    const buckets=[];
    for(let i=0;i<data.length;i+=4){
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a<180) continue;

      const max=Math.max(r,g,b), min=Math.min(r,g,b);
      const sat=max===0?0:(max-min)/max;
      const lum=(r+g+b)/3;

      // Ignore near-black / near-white pixels so the lights have color.
      if(lum<22 || lum>245 || sat<0.12) continue;

      buckets.push({r,g,b,s:sat,l:lum});
    }

    // Group similar colors into broad palette buckets.
    const groups=[];
    for(const c of buckets){
      let found=groups.find(g=>{
        const dr=g.r-c.r, dg=g.g-c.g, db=g.b-c.b;
        return Math.sqrt(dr*dr+dg*dg+db*db)<55;
      });
      if(found){
        found.r=(found.r*found.n+c.r)/(found.n+1);
        found.g=(found.g*found.n+c.g)/(found.n+1);
        found.b=(found.b*found.n+c.b)/(found.n+1);
        found.n++;
      }else groups.push({...c,n:1});
    }

    groups.sort((a,b)=>(b.n*b.s)-(a.n*a.s));
    const colors=groups.slice(0,4).map(c=>{
      const boost=1.15;
      return `rgb(${Math.min(255,Math.round(c.r*boost))},${Math.min(255,Math.round(c.g*boost))},${Math.min(255,Math.round(c.b*boost))})`;
    });

    if(!colors.length) colors=["rgb(30,215,96)"];
    applyPalette(colors);
  }catch(e){
    applyPalette(["rgb(30,215,96)"]);
  }
}
function show(track,playing){let image=track.album?.images?.[0]?.url||"";$("title").textContent=track.name||"Sin título";$("artist").textContent=(track.artists||[]).map(a=>a.name).join(", ");$("album").textContent=track.album?.name||"";duration=track.duration_ms||0;$("dur").textContent=time(duration);$("dur").dataset.ms=duration;if(image){$("cover").src=image;$("cover").style.display="block";$("placeholder").style.display="none";$("modalImg").src=image;$("back").style.backgroundImage=`url("${image}")`;$("cover").onload=()=>theme($("cover"));}setPlay(playing);status(playing?"Reproduciendo en Spotify":"Pausado en Spotify",true)}
async function api(path,opt={}){if(!token||Date.now()>expires){logout();throw Error("auth")}let r=await fetch(API+path,{...opt,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});if(r.status===401){logout();throw Error("auth")}if(!r.ok)throw Error(r.status);return r.status===204?null:r.json()}
function random(n=96){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",b=crypto.getRandomValues(new Uint8Array(n));return [...b].map(x=>c[x%c.length]).join("")}
async function challenge(v){return btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v))))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function login(){let v=random();sessionStorage.setItem("pkce",v);let ch=await challenge(v);let p=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,code_challenge_method:"S256",code_challenge:ch,scope:SCOPES.join(" ")});location.href="https://accounts.spotify.com/authorize?"+p}
async function callback(){let p=new URLSearchParams(location.search),code=p.get("code");if(!code)return;let v=sessionStorage.getItem("pkce");let body=new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:v});let r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(!r.ok)throw Error("token");let d=await r.json();token=d.access_token;expires=Date.now()+d.expires_in*1000-30000;localStorage.setItem("spotify_access_token",token);localStorage.setItem("spotify_expires_at",expires);history.replaceState({}, "", REDIRECT_URI)}
async function now(){try{let d=await api("/me/player");if(!d?.item){status("Spotify conectado · sin reproducción");return}if(d.item.id!==currentId){currentId=d.item.id;show(d.item,d.is_playing);await getLyrics(d.item)}else setPlay(d.is_playing);position=d.progress_ms||0;duration=d.item.duration_ms||0;draw()}catch(e){}}
function draw(){let pct=duration?position/duration*100:0;$("fill").style.width=Math.min(100,pct)+"%";$("cur").textContent=time(position);$("dur").textContent=time(duration);activeLyric()}
async function control(type){try{if(type==="toggle"){let d=await api("/me/player");if(d?.is_playing)await api("/me/player/pause",{method:"PUT"});else await api("/me/player/play",{method:"PUT"})}else await api("/me/player/"+type,{method:"POST"});setTimeout(now,150)}catch{status("Spotify no pudo ejecutar el control")}}
async function getLyrics(t){lyrics=[];$("lyrics").innerHTML='<p class="empty">Buscando letras…</p>';try{let u=new URL("https://lrclib.net/api/get");u.searchParams.set("track_name",t.name);u.searchParams.set("artist_name",t.artists?.[0]?.name||"");u.searchParams.set("album_name",t.album?.name||"");u.searchParams.set("duration",Math.round(t.duration_ms/1000));let r=await fetch(u);if(!r.ok)throw Error();let d=await r.json();render(d.syncedLyrics||d.plainLyrics||"")}catch{$("lyrics").innerHTML='<p class="empty">No encontramos letras disponibles en LRCLIB.</p>'}}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(text){lyrics=[];for(let l of text.split("\n")){let m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s?(.*)$/);if(m)lyrics.push({t:+m[1]*60+ +m[2],s:m[3]||"♪"});else if(l.trim())lyrics.push({t:null,s:l.trim()})}$("lyrics").innerHTML=lyrics.map((x,i)=>`<p class="line" data-i="${i}">${esc(x.s)}</p>`).join("")}
function activeLyric(){let i=-1;for(let n=0;n<lyrics.length;n++)if(lyrics[n].t!=null&&lyrics[n].t<=position/1000)i=n;if(i<0)return;document.querySelectorAll(".line.active").forEach(x=>x.classList.remove("active"));let e=document.querySelector(`[data-i="${i}"]`);if(e){e.classList.add("active");$("lyrics").scrollTo({top:Math.max(0,e.offsetTop-$("lyrics").clientHeight*.42),behavior:"smooth"})}}
$("connect").onclick=login;$("play").onclick=()=>control("toggle");$("prev").onclick=()=>control("previous");$("next").onclick=()=>control("next");
$("bar").onclick=async e=>{if(!token)return;let d=await api("/me/player"),r=e.offsetX/e.currentTarget.clientWidth;await api("/me/player/seek?position_ms="+Math.floor(d.item.duration_ms*r),{method:"PUT"});setTimeout(now,100)};
$("coverbox").onclick=()=>{if($("cover").src){$("modal").classList.add("open")}};$("close").onclick=()=>$("modal").classList.remove("open");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};
function logout(){token=null;localStorage.removeItem("spotify_access_token");localStorage.removeItem("spotify_expires_at");$("connect").textContent="Conectar con Spotify"}
(async()=>{try{await callback()}catch{}if(token){$("connect").textContent="Spotify conectado ✓";await now();poll=setInterval(now,1500)}setInterval(()=>{if(token&&duration){position=Math.min(duration,position+250);draw()}},250)})();
</script>
</body>
</html>
