<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spotify Now Playing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#07070a;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:18px;overflow-x:hidden}
#app{--accent:#1ed760;--accent2:#0d2918;--dark:#08090b;position:relative;width:min(920px,100%);overflow:hidden;border:1px solid #ffffff18;border-radius:30px;background:linear-gradient(135deg,var(--dark),#101115);box-shadow:0 30px 100px #000b;isolation:isolate;transition:background 1s ease}
.bg{position:absolute;inset:-18%;z-index:-4;background:transparent;filter:none;opacity:0;pointer-events:none}
.artGlow{position:absolute;inset:-24%;z-index:-3;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(58px) saturate(1.65) brightness(1.12);opacity:.88;transform:scale(1.16);transition:background-image .18s ease,opacity .18s ease,filter .18s ease;pointer-events:none}
.wave{position:absolute;z-index:-2;width:45%;aspect-ratio:1;border-radius:50%;left:30%;top:25%;background:transparent;filter:none;opacity:0;pointer-events:none}
.playing .wave{animation-duration:1s;opacity:.2}
@keyframes breathe{from{transform:scale(.7)}to{transform:scale(1.3)}}
.content{padding:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:11px;font-weight:900;letter-spacing:.18em;color:#ffffff8c}
.status{font-size:12px;color:#ffffff80}
.layout{display:grid;grid-template-columns:minmax(250px,390px) minmax(0,1fr);gap:42px;align-items:center;margin-top:28px}
.art{width:min(390px,100%);aspect-ratio:1;margin:auto;position:relative}
.cover{width:100%;height:100%;border-radius:24px;background:linear-gradient(145deg,#1d1e24,#101116);border:1px solid #ffffff18;display:grid;place-items:center;overflow:hidden;box-shadow:0 24px 70px #0009}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.placeholder{font-size:64px;color:#ffffff20}
.vinyl{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;left:15%;top:15%;z-index:-1;background:repeating-radial-gradient(circle,#101014 0 5px,#2a2a2e 6px 8px);transition:.5s}
.playing .vinyl{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info{min-width:0}
.kicker{font-size:11px;font-weight:900;letter-spacing:.17em;color:#ffffff70}
.titlebox{width:100%;overflow:hidden;white-space:nowrap;margin-top:9px}
.title{display:inline-block;max-width:100%;font-size:clamp(32px,5vw,60px);font-weight:900;line-height:1.03;letter-spacing:-.04em}
.title.moving{padding-right:80px;animation:marquee 11s linear infinite}
@keyframes marquee{0%,12%{transform:translateX(0)}78%,100%{transform:translateX(var(--move))}}
.artist{font-size:19px;color:#fff;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album{font-size:13px;color:#ffffff70;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{margin-top:28px;width:100%;min-width:0}
.bar{height:7px;width:100%;background:#ffffff18;border-radius:99px;overflow:hidden;cursor:pointer}
.fill{height:100%;width:0;background:var(--accent);border-radius:99px;box-shadow:0 0 15px var(--accent);transition:width .25s linear}
.times{display:flex;justify-content:space-between;color:#ffffff60;font-size:11px;margin-top:7px}
.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
.ctrl{width:50px;height:50px;border-radius:50%;border:1px solid var(--accent);background:#0b100d;color:var(--accent);font-size:18px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 1px #ffffff08 inset,0 0 18px rgba(30,215,96,.12);transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.ctrl:hover{background:rgba(30,215,96,.12);transform:scale(1.06);box-shadow:0 0 24px rgba(30,215,96,.22)}
.ctrl:active{transform:scale(.94)}
.ctrl.main{width:62px;height:62px;background:#1ed760;color:#071009;border:0;font-size:22px;box-shadow:0 8px 30px rgba(30,215,96,.28)}
.ctrl.main:hover{background:#25e56b;box-shadow:0 10px 36px rgba(30,215,96,.38)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button{font-family:inherit;cursor:pointer}
.connect,.open{min-height:46px;border-radius:999px;padding:12px 18px;font-weight:850}
.connect{border:0;background:var(--accent);color:#071009}
.open{border:1px solid #ffffff18;background:#ffffff0d;color:#fff}
.open:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:12px;line-height:1.5;color:#ffffff70;margin-top:14px}

.lyrics-wrap{margin-top:28px}.lyrics-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff0a;color:#fff;font:inherit;font-weight:850;cursor:pointer;transition:.2s}.lyrics-toggle:hover{background:#ffffff12}.lyrics-toggle .chev{transition:transform .25s ease;color:#ffffff70}.lyrics-wrap.open .chev{transform:rotate(180deg)}.lyrics-panel{margin-top:10px;max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .25s ease}.lyrics-wrap.open .lyrics-panel{max-height:330px;opacity:1}.lyrics-scroll{max-height:310px;overflow-y:auto;padding:22px 20px;border:1px solid #ffffff12;border-radius:18px;background:#050608aa;scrollbar-width:thin}.lyrics-line{font-size:17px;line-height:1.75;color:#ffffff72;margin:0 0 17px}.lyrics-line:last-child{margin-bottom:0}.lyrics-note{font-size:12px;color:#ffffff50;line-height:1.5;margin-top:14px}.lyrics-loading{color:#ffffff65;font-size:15px;line-height:1.7;text-align:center;padding:18px 8px}.lyrics-error{color:#ffffff58;font-size:15px;line-height:1.7;text-align:center;padding:18px 8px}.lyrics-meta{font-size:11px;color:#ffffff38;text-align:center;margin-top:12px}@media(max-width:720px){.lyrics-line{font-size:16px}.lyrics-scroll{padding:20px 17px}}

.hidden{display:none!important}
.dots{position:absolute;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.dots i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);opacity:.5;bottom:-10px;animation:rise 5s linear infinite}
@keyframes rise{to{transform:translateY(-700px) translateX(var(--x));opacity:0}}
@media(max-width:720px){
body{padding:8px}.content{padding:20px}.layout{grid-template-columns:1fr;gap:24px}.art{width:min(310px,82vw)}.info{text-align:center}.progress{margin-top:24px}.artist,.album{text-align:center}.actions{justify-content:center}.titlebox{text-align:center}.controls{margin-top:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main id="app">
<div class="bg"></div><div class="artGlow" id="artGlow"></div><div class="wave"></div><div class="dots" id="dots"></div>
<div class="content">
<header class="top"><span class="brand">NOW PLAYING · SPOTIFY</span><span id="status" class="status">Desconectado</span></header>
<section class="layout">
<div class="art">
<div class="cover"><span id="placeholder" class="placeholder">♪</span><img id="cover" alt="Portada del álbum"></div>
<div class="vinyl"></div>
</div>
<div class="info">
<div class="kicker">CURRENT TRACK</div>
<div class="titlebox"><div id="title" class="title">Conecta Spotify</div></div>
<div id="artist" class="artist">Tu canción aparecerá aquí</div>
<div id="album" class="album">Conecta tu cuenta para empezar</div>
<div class="progress">
<div id="bar" class="bar"><div id="fill" class="fill"></div></div>
<div class="times"><span id="current">0:00</span><span id="total">0:00</span></div>
</div>
<div id="controls" class="controls hidden">
<button id="prev" class="ctrl" type="button" aria-label="Canción anterior">‹‹</button>
<button id="toggle" class="ctrl main" type="button">▶</button>
<button id="next" class="ctrl" type="button" aria-label="Siguiente canción">››</button>
</div>
<div class="actions">
<button id="connect" class="connect" type="button">🎧 Conectar Spotify</button>
<button id="open" class="open" type="button" disabled>↗ Abrir en Spotify</button><button id="logout" class="open hidden" type="button">Cerrar sesión</button>
</div>
<div id="msg" class="msg">Conecta Spotify para detectar automáticamente lo que estás escuchando.</div>
<div class="lyrics-wrap" id="lyricsWrap"><button id="lyricsToggle" class="lyrics-toggle" type="button" aria-expanded="false"><span>♫ Letra</span><span class="chev">⌄</span></button><div class="lyrics-panel" aria-hidden="true"><div class="lyrics-scroll" id="lyricsScroll"><div class="lyrics-loading">Reproduce una canción para buscar su letra…</div></div></div><div class="lyrics-note">Letra no sincronizada · desliza libremente</div><div class="lyrics-meta" id="lyricsMeta"></div></div>

</div>
</section>
</div>
</main>
<script>
const CLIENT_ID="7cd5bc8f5dc048a388537fb6d19a74b9";
const REDIRECT_URI=window.location.origin+window.location.pathname;
const SCOPES="user-read-currently-playing user-read-playback-state user-modify-playback-state";
const $=id=>document.getElementById(id);
let token="",trackId="",duration=0,trackUrl="",playing=false,deviceId="";
const lyricsWrap=$("lyricsWrap"),lyricsToggle=$("lyricsToggle"),lyricsPanel=lyricsWrap.querySelector(".lyrics-panel"),lyricsScroll=$("lyricsScroll"),lyricsMeta=$("lyricsMeta");
let lyricsRequestId=0;
lyricsToggle.addEventListener("click",()=>{const open=lyricsWrap.classList.toggle("open");lyricsToggle.setAttribute("aria-expanded",String(open));lyricsPanel.setAttribute("aria-hidden",String(!open));});
function escapeHtml(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function renderLyrics(text){
 const clean=String(text||"").replace(/\r/g,"").trim();
 if(!clean){lyricsScroll.innerHTML='<div class="lyrics-error">No hay letra disponible para esta canción.</div>';lyricsMeta.textContent="";return;}
 const lines=clean.split("\n");
 lyricsScroll.innerHTML=lines.map(line=>`<p class="lyrics-line">${escapeHtml(line)||"&nbsp;"}</p>`).join("");
 lyricsScroll.scrollTop=0;
}
async function loadLyrics(item){
 const request=++lyricsRequestId;
 lyricsScroll.innerHTML='<div class="lyrics-loading">Buscando letra…</div>';lyricsMeta.textContent="";
 try{
  const params=new URLSearchParams({track_name:item.name,artist_name:item.artists?.map(a=>a.name).join(", ")||""});
  if(item.album?.name)params.set("album_name",item.album.name);
  if(item.duration_ms)params.set("duration",String(Math.round(item.duration_ms/1000)));
  const r=await fetch("https://lrclib.net/api/get?"+params.toString(),{headers:{"Lrclib-Client":"Spotify Song Widget V12 (https://neiraprox.github.io/spotify-song-widget/)"},cache:"no-store"});
  if(request!==lyricsRequestId)return;
  if(r.status===404){renderLyrics("");return;}
  if(!r.ok)throw new Error("lyrics request failed");
  const d=await r.json();
  if(request!==lyricsRequestId)return;
  renderLyrics(d.plainLyrics || "");
  if(d.trackName && d.artistName)lyricsMeta.textContent=`Fuente: LRCLIB · ${d.artistName} — ${d.trackName}`;
 }catch(e){
  if(request!==lyricsRequestId)return;
  lyricsScroll.innerHTML='<div class="lyrics-error">No se pudo cargar la letra ahora.<br>Inténtalo de nuevo en unos segundos.</div>';lyricsMeta.textContent="";
 }
}


function b64(x){return btoa(String.fromCharCode(...new Uint8Array(x))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function rand(){const a=new Uint8Array(64);crypto.getRandomValues(a);return b64(a)}
async function sha(v){return b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))}
function fmt(ms){let s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
async function login(){
 const verifier=rand(),state=rand();localStorage.setItem("spotify_verifier",verifier);localStorage.setItem("spotify_state",state);
 const u=new URL("https://accounts.spotify.com/authorize");u.search=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,scope:SCOPES,code_challenge_method:"S256",code_challenge:await sha(verifier),state}).toString();location.href=u;
}
async function callback(){
 const p=new URLSearchParams(location.search),code=p.get("code");if(!code)return;
 if(p.get("state")!==localStorage.getItem("spotify_state")){$("msg").textContent="No se pudo verificar la autorización.";return}
 const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem("spotify_verifier")})});
 const d=await r.json();if(!r.ok){$("msg").textContent="Spotify rechazó la autorización.";return}
 token=d.access_token;localStorage.setItem("spotify_access_token",token);localStorage.setItem("spotify_connected","1");history.replaceState({},document.title,REDIRECT_URI);$("connect").classList.add("hidden");$("controls").classList.remove("hidden");$("logout").classList.remove("hidden");$("status").textContent="Conectado";poll();
}
function title(t){
 $("title").textContent=t;
 requestAnimationFrame(()=>{const e=$("title"),w=e.parentElement,over=e.scrollWidth-w.clientWidth;if(over>6){e.classList.add("moving");e.style.setProperty("--move",`-${over+70}px`)}else{e.classList.remove("moving");e.style.removeProperty("--move")}})
}
function colors(src){
 try{
  const u=src || $("cover").currentSrc || $("cover").src;
  if(!u)return;
  const glow=$("artGlow");
  // Instant visual change: the artwork itself is always the base of the ambient light.
  glow.style.backgroundImage=`url("${u}")`;
  glow.style.opacity=".88";

  const img=$("cover");
  // Attempt extraction from the already-rendered cover. If the browser blocks pixel access,
  // the blurred artwork still supplies the correct colors visually.
  try{
   const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
   const s=36;c.width=s;c.height=s;x.drawImage(img,0,0,s,s);
   const d=x.getImageData(0,0,s,s).data,b=new Map();
   for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],bl=d[i+2],mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);
    if(mx<18 || (mx>245 && mx-mn<14))continue;
    const qr=Math.round(r/16)*16,qg=Math.round(g/16)*16,qb=Math.round(bl/16)*16;
    const sat=mx?((mx-mn)/mx):0;
    const weight=1+sat*2;
    const k=`${qr},${qg},${qb}`;
    b.set(k,(b.get(k)||0)+weight);
   }
   let best=null,score=-1;
   for(const [k,v] of b){if(v>score){score=v;best=k}}
   if(best){
    const [r,g,bl]=best.split(",").map(Number);
    const light=(v)=>Math.min(255,Math.round(v+(255-v)*.42));
    const rr=light(r),gg=light(g),bb=light(bl);
    document.documentElement.style.setProperty("--accent2",`rgb(${rr},${gg},${bb})`);
    document.documentElement.style.setProperty("--accentGlow",`rgba(${rr},${gg},${bb},.50)`);
    document.documentElement.style.setProperty("--accentGlowSoft",`rgba(${rr},${gg},${bb},.22)`);
   }
  }catch(_){}
 }catch(e){}
}
let pollingTimer=null, pollBusy=false, commandBusy=false, lastPollAt=0;
function refreshFast(targetId="",targetPlaying=null){
 if(pollingTimer)clearInterval(pollingTimer);
 let tries=0;
 const started=performance.now();
 pollingTimer=setInterval(async()=>{
   tries++;
   await poll(true);
   const reached=(targetId && trackId!==targetId) ||
                 (targetPlaying!==null && playing===targetPlaying);
   if(reached || tries>=35 || performance.now()-started>5000){
     clearInterval(pollingTimer);pollingTimer=null;
   }
 },100);
}

async function poll(force=false){
 if(!token || pollBusy)return;
 const now=performance.now();
 if(!force && now-lastPollAt<450)return;
 pollBusy=true;lastPollAt=now;
 try{
  const r=await fetch("https://api.spotify.com/v1/me/player",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
  if(r.status===401){$("status").textContent="Sesión expirada";return}
  if(r.status===204||!r.ok){$("msg").textContent="Reproduce una canción en Spotify…";return}
  const d=await r.json(),item=d.item;if(!item){$("msg").textContent="Reproduce una canción en Spotify…";return}
  duration=item.duration_ms||0;playing=!!d.is_playing;
  $("current").textContent=fmt(d.progress_ms||0);$("total").textContent=fmt(duration);
  $("fill").style.width=duration?Math.min(100,d.progress_ms/duration*100)+"%":"0%";
  $("toggle").textContent=playing?"❚❚":"▶";$("status").textContent=playing?"Reproduciendo":"Pausado";
  $("app").classList.toggle("playing",playing);
  if(item.id!==trackId){
    trackId=item.id;
    title(item.name);
    $("artist").textContent=item.artists.map(a=>a.name).join(", ");
    $("album").textContent=item.album?.name||"";
    const src=item.album?.images?.[0]?.url;
    if(src){
      $("cover").src=src;
      $("cover").style.display="block";
      $("placeholder").classList.add("hidden");
      $("artGlow").style.backgroundImage=`url("${src}")`;
      colors(src);
    }
    trackUrl=item.external_urls?.spotify||"";
    $("open").disabled=!trackUrl;
    loadLyrics(item);
  }
  $("msg").textContent="✓ Sincronizado con Spotify";
 }catch(e){
  if(!commandBusy)$("msg").textContent="Esperando a Spotify…";
 }finally{pollBusy=false}
}

async function apiRequest(url, options={}){
 const headers=Object.assign({Authorization:"Bearer "+token},options.headers||{});
 return fetch("https://api.spotify.com/v1"+url,Object.assign({},options,{headers}));
}
async function getDevice(){
 try{
  const r=await apiRequest("/me/player/devices");
  if(!r.ok)return "";
  const d=await r.json(), list=d.devices||[];
  const active=list.find(x=>x.is_active);
  const chosen=active||list.find(x=>x.type!=="Computer")||list[0];
  deviceId=chosen?.id||"";
  return deviceId;
 }catch(e){return ""}
}
async function ctl(action){
 if(!token || commandBusy)return;
 commandBusy=true;
 const oldTrack=trackId,oldPlaying=playing;

 // Change the visible interface BEFORE waiting for Spotify.
 if(action==="pause" || action==="play"){
   playing=action==="play";
   $("toggle").textContent=playing?"❚❚":"▶";
   $("status").textContent=playing?"Reproduciendo":"Pausado";
   $("app").classList.toggle("playing",playing);
 }
 if(action==="next"||action==="previous"){
   $("msg").textContent="Cambiando…";
 }

 try{
   let id=deviceId||await getDevice();
   if(!id){$("msg").textContent="Abre Spotify y reproduce una canción primero.";return}
   let url="",options={method:"POST"};
   if(action==="next")url="/me/player/next?device_id="+encodeURIComponent(id);
   if(action==="previous")url="/me/player/previous?device_id="+encodeURIComponent(id);
   if(action==="pause"){url="/me/player/pause?device_id="+encodeURIComponent(id);options.method="PUT";}
   if(action==="play"){url="/me/player/play?device_id="+encodeURIComponent(id);options.method="PUT";}

   const r=await apiRequest(url,options);
   if(!r.ok){
     try{
       const e=await r.json();
       // Device may have changed; retry exactly once with the newest device.
       if(e.error?.status===404){
         deviceId="";
         id=await getDevice();
         if(id){
           url=url.replace(/device_id=[^&]+/,"device_id="+encodeURIComponent(id));
           await apiRequest(url,options);
         }
       }
     }catch(_){}
   }

   // First check immediately, then every 100ms until Spotify reflects it.
   await poll(true);
   refreshFast((action==="next"||action==="previous")?oldTrack:"",action==="play"?true:action==="pause"?false:null);
 }finally{
   commandBusy=false;
 }
}
$("connect").onclick=login;
$("open").onclick=()=>trackUrl&&window.open(trackUrl,"_blank","noopener");$("logout").onclick=()=>{localStorage.removeItem("spotify_access_token");localStorage.removeItem("spotify_connected");localStorage.removeItem("spotify_verifier");localStorage.removeItem("spotify_state");location.reload()};
$("toggle").onclick=()=>ctl(playing?"pause":"play");
$("next").onclick=()=>ctl("next");
$("prev").onclick=()=>ctl("previous");
$("bar").onclick=async e=>{
 if(!duration)return;
 const id=await getDevice();
 if(!id){$("msg").textContent="Abre Spotify y reproduce una canción primero.";return}
 const r=$("bar").getBoundingClientRect(),ms=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*duration);
 const resp=await apiRequest("/me/player/seek?position_ms="+ms+"&device_id="+encodeURIComponent(id),{method:"PUT"});
 if(!resp.ok)$("msg").textContent="No se pudo cambiar la posición.";
 setTimeout(poll,350);
};
for(let i=0;i<16;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.animationDelay=-Math.random()*5+"s";p.style.setProperty("--x",(Math.random()*180-90)+"px");$("dots").appendChild(p)}
async function restoreSession(){
 const saved=localStorage.getItem("spotify_access_token");
 if(!saved)return false;
 token=saved;
 $("connect").classList.add("hidden");
 $("controls").classList.remove("hidden");
 $("status").textContent="Conectado";
 $("msg").textContent="Reconectando con Spotify…";
 await poll(true);
 return true;
}
(async()=>{const restored=await restoreSession();if(!restored)await callback();})();
setInterval(()=>poll(false),120);
</script>
</body>
</html>
